<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Shop</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0 25px;
        }

        .logo {
            font-size: 45px;
        }

        .header h1 {
            margin: 8px 0;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #9ca3af;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .card {
            background: #1f2937;
            border-radius: 18px;
            padding: 25px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:active {
            transform: scale(0.96);
        }

        .icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 15px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🛍️</div>
        <h1>Central Shop</h1>
        <p>Welcome to our shop</p>
    </div>

    <div class="grid">

        <div class="card" onclick="openCategory('Game Top Up')">
            <div class="icon">🎮</div>
            <div class="title">Game Top Up</div>
        </div>

        <div class="card" onclick="openCategory('Diamonds')">
            <div class="icon">💎</div>
            <div class="title">Diamonds</div>
        </div>

        <div class="card" onclick="openCategory('Telegram Stars')">
            <div class="icon">⭐</div>
            <div class="title">Telegram Stars</div>
        </div>

        <div class="card" onclick="openCategory('Premium')">
            <div class="icon">👑</div>
            <div class="title">Premium</div>
        </div>

        <div class="card" onclick="openCategory('My Orders')">
            <div class="icon">📦</div>
            <div class="title">My Orders</div>
        </div>

        <div class="card" onclick="openCategory('My Account')">
            <div class="icon">👤</div>
            <div class="title">My Account</div>
        </div>

    </div>

    <div class="footer">
        Central Shop © 2026
    </div>

</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function openCategory(category) {
        tg.showAlert("You selected: " + category);
    }
</script>

</body>
</html>
