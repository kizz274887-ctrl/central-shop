<!doctype html>
<html>
<head><meta charset="utf-8"/><title>Admin - Orders</title></head>
<body>
  <h2>Admin: Orders</h2>
  <p>Open this page with ?admin_token=YOUR_ADMIN_TOKEN or send Authorization: Bearer YOUR_ADMIN_TOKEN.</p>
  <div id="orders"></div>
  <script>
    async function load() {
      const q = new URLSearchParams(location.search);
      const token = q.get('admin_token');
      const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
      const res = await fetch('/admin/orders', { headers });
      if (res.status === 401) {
        document.getElementById('orders').innerText = 'Unauthorized (provide admin_token)';
        return;
      }
      const orders = await res.json();
      const container = document.getElementById('orders');
      container.innerHTML = '';
      orders.forEach(o => {
        const d = document.createElement('div');
        d.style='border:1px solid #ccc;padding:8px;margin:8px';
        d.innerHTML = `<b>${o.id}</b> — ${o.itemName} — ${o.status} ${o.redeem_code ? '<br/>Code: '+o.redeem_code : ''}<br/>
          <button data-id="${o.id}">Resend</button>`;
        container.appendChild(d);
      });
      container.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          const id = e.target.dataset.id;
          const r = await fetch('/admin/resend', {
            method:'POST',
            headers: { 'Content-Type':'application/json', ...(token?{'Authorization':'Bearer '+token}:{}) },
            body: JSON.stringify({ orderId: id })
          });
          if (r.ok) { alert('Resend recorded'); load(); } else alert('Failed');
        });
      });
    }
    load();
  </script>
</body>
</html>
